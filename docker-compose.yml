version: '3.8'

services:
 app:
   build:
     context: .
     dockerfile: docker/php/Dockerfile
   container_name: hurgada_app
   working_dir: /var/www
   volumes:
     - ./:/var/www
   networks:
     - hurgada

 nginx:
   image: nginx:alpine
   container_name: hurgada_nginx
   ports:
     - "8000:80"
   volumes:
     - ./:/var/www
     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
   depends_on:
     - app
   networks:
     - hurgada

 mysql:
   image: mysql:8.0
   container_name: hurgada_mysql
   restart: unless-stopped
   environment:
     MYSQL_DATABASE: hurgada
     MYSQL_ROOT_PASSWORD: root
   ports:
     - "3307:3306"
   volumes:
     - dbdata:/var/lib/mysql
   networks:
     - hurgada

 phpmyadmin:
   image: phpmyadmin/phpmyadmin
   container_name: hurgada_phpmyadmin
   ports:
     - "9090:80"
   environment:
     PMA_HOST: mysql
   depends_on:
     - mysql
   networks:
     - hurgada

networks:
 hurgada:

volumes:
 dbdata: